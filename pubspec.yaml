name: flutter_application_1
description: "Estrave - AI-driven travel planning app powered by Gemini."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Gemini AI
  google_generative_ai: ^0.4.6

  # Local persistence for last generated trip
  shared_preferences: ^2.3.2

  # Nicer formatting (currency, dates)
  intl: ^0.19.0

  # Material icons / fonts
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
